<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>24" Towel Rack AR</title>

  <!-- Google Model Viewer -->
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      cursor: grab;
      --poster-color: transparent;
    }

    model-viewer:active {
      cursor: grabbing;
    }

    #ar-button {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      border: 0;
      border-radius: 999px;
      padding: 14px 22px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
      cursor: pointer;
      white-space: nowrap;
    }

    #loading {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.9);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #333;
      z-index: 10;
      pointer-events: none;
    }

    #hint {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,.88);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      color: #333;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <model-viewer
    id="viewer"
    src="Towel Rack-24.glb"

    loading="eager"
    reveal="auto"

    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="800"
    rotation-per-second="18deg"

    camera-orbit="0deg 75deg 105%"
    field-of-view="30deg"

    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1"
    tone-mapping="neutral"

    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="wall"
    ar-scale="fixed"
    xr-environment

    alt="24 inch wall mounted towel rack 3D model">

    <button slot="ar-button" id="ar-button">
      View in your space
    </button>

  </model-viewer>

  <div id="loading">Loading 3D model…</div>
  <div id="hint">Drag to rotate • Scroll/pinch to zoom</div>

  <script>
    const viewer = document.getElementById('viewer');
    const loading = document.getElementById('loading');

    viewer.addEventListener('load', () => {
      loading.style.display = 'none';
      console.log('3D model loaded successfully');
      console.log('Dimensions:', viewer.getDimensions());
    });

    viewer.addEventListener('error', (event) => {
      loading.textContent = '3D model could not load';
      loading.style.color = '#b00020';
      console.error('Model Viewer error:', event);
    });
  </script>

</body>
</html>
